<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Nexio Social AI</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
         background: #071426; color: #fff; font: 16px/1.5 system-ui, sans-serif; text-align: center; }
  a { color: #29B6FF; }
</style>
</head>
<body>
<main>
  <p id="message">Returning to Nexio Social AI…</p>
  <p><a id="open" href="#">Open the app</a></p>
</main>
<script>
  // Static page, no server: it hands Instagram's one-time code to the app and keeps nothing.
  // Instagram requires an https redirect, and this is the only step that needs one.
  const params = new URLSearchParams(window.location.search);
  const target = "nexiosocial://oauth?" + params.toString();
  document.getElementById("open").href = target;
  if (!params.has("code") && !params.has("error")) {
    document.getElementById("message").textContent = "This page is used while signing in to Instagram.";
  } else {
    window.location.replace(target);
  }
  history.replaceState(null, "", window.location.pathname);
</script>
</body>
</html>
